# Workflow 名称，在 GitHub Actions 界面中显示
name: Build and Deploy to Tencent COS

# 触发条件配置
on:
  # 当代码推送到 main 分支时触发
  push:
    branches:
      - 'main'
  # 允许手动触发工作流
  workflow_dispatch:

# 定义所有要执行的 jobs
jobs:
  # 构建 job：构建项目并生成静态文件
  build:
    # 运行在最新版本的 Ubuntu 虚拟机上
    runs-on: ubuntu-latest

    # 权限配置：允许读取仓库内容
    permissions:
      contents: read

    # 构建步骤列表
    steps:
      # 步骤 1: 检出源代码
      # 将仓库代码克隆到 runner 的工作目录
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 步骤 2: 设置 Node.js 环境
      # 安装并配置指定版本的 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # 使用 Node.js 24 版本
          node-version: '24'
          # 启用 yarn 缓存
          cache: 'yarn'

      # 步骤 3: 缓存 node_modules
      # 缓存依赖包以加快构建速度
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # 使用 yarn.lock 的哈希值作为缓存键
          key: ${{ runner.os }}-node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      # 步骤 4: 缓存构建产物
      # 缓存 Nuxt 和 Vite 的构建缓存
      - name: Cache Vite/Nuxt build cache
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache
          key: ${{ runner.os }}-nuxt-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-cache-

      # 步骤 5: 安装依赖
      # 根据 yarn.lock 文件安装项目依赖
      - name: Install Dependencies
        run: |
          if [ -f yarn.lock ]; then
            # 如果存在 yarn.lock，则严格按照 lock 文件安装
            yarn install --frozen-lockfile
          else
            # 否则直接安装
            yarn install
          fi

      # 步骤 6: 构建项目
      # 执行 Nuxt 的静态生成命令，生成 dist 目录
      - name: Build Project
        run: yarn generate

      # 步骤 7: 上传构建产物
      # 将构建生成的 dist 目录上传为 artifact，供 deploy job 使用
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          path: dist
          name: dist

  # 部署 job：将构建产物部署到腾讯云
  deploy:
    # 依赖 build job，只有 build 成功后才会执行
    needs: build
    # 运行在最新版本的 Ubuntu 虚拟机上
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 下载构建产物
      # 下载 build job 上传的 dist artifact
      - name: Download Artifacts
        uses: actions/download-artifact@v3

      # 步骤 2: 上传到腾讯云 COS（对象存储）
      # 将静态文件同步到腾讯云 COS
      - name: Upload COS
        uses: zkqiang/tencent-cos-action@v0.1.0
        with:
          # COS CLI 命令参数：
          # delete -r -f / : 删除 COS 存储桶根目录下的所有文件（-r 递归，-f 强制）
          # upload -r ./dist/ / : 递归上传本地 dist 目录到 COS 根目录
          args: delete -r -f / && upload -r ./dist/ /
          # 腾讯云 API 密钥 ID（从 GitHub Secrets 中读取）
          secret_id: ${{ secrets.COS_SECRET_ID }}
          # 腾讯云 API 密钥 Key（从 GitHub Secrets 中读取）
          secret_key: ${{ secrets.COS_SECRET_KEY }}
          # 目标存储桶名称（从 GitHub Secrets 中读取）
          bucket: ${{ secrets.COS_WEB_BUCKET_PROD }}
          # 存储桶所在区域：南京
          region: ap-nanjing
        # 设置超时时间：3 分钟
        timeout-minutes: 3

      # 步骤 3: 刷新腾讯云 ef.yituliu.cn 的 CDN 缓存
      # 清除 CDN 缓存，确保用户访问到最新内容
      - name: Refresh Tencent Cloud CDN Purge Cache
        uses: keithnull/tencent-cloud-cdn-purge-cache@v1.0
        env:
          # 腾讯云 API 密钥
          SECRET_ID: ${{ secrets.COS_SECRET_ID}}
          SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          # 要刷新缓存的 URL 路径
          PATHS: 'https://ef.yituliu.cn/'
          # 刷新类型：flush 表示刷新（清除缓存并重新回源获取）
          FLUSH_TYPE: 'flush'
