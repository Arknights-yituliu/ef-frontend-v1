name: Build and Deploy to Tencent COS

# 触发条件配置
on:
  # 当代码推送到 main 分支时触发
  push:
    branches:
      - 'main'
  # 允许手动触发工作流
  workflow_dispatch:

# 定义所有要执行的 jobs
jobs:
  # 构建 job：构建项目并生成静态文件
  build:
    # 运行在最新版本的 Ubuntu 虚拟机上
    runs-on: ubuntu-latest

    # 权限配置：定义此 job 需要的 GitHub 权限
    permissions:
      # 只需要读取仓库内容的权限
      contents: read

    outputs:
      artifact-id: ${{ steps.upload-artifacts.outputs.artifact-id }}

    # 构建步骤列表
    steps:
      # 步骤 1: 检出源代码
      # 将仓库代码克隆到 runner 的工作目录
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 步骤 2: 设置 Node.js 环境
      # 安装指定版本的 Node.js 并配置 yarn 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # 使用 Node.js 24 版本
          node-version: '24'
          # 启用 yarn 依赖缓存，加速后续安装
          cache: 'yarn'

      # 步骤 3: 缓存 node_modules 目录
      # 如果 yarn.lock 未改变，可以复用已安装的依赖，大幅提升构建速度
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          # 要缓存的目录路径
          path: node_modules
          # 缓存键：基于操作系统和 yarn.lock 文件的哈希值
          # yarn.lock 改变时缓存失效，需要重新安装
          key: ${{ runner.os }}-node_modules-${{ hashFiles('yarn.lock') }}
          # 恢复键：如果精确匹配失败，尝试匹配部分键（回退策略）
          restore-keys: |
            ${{ runner.os }}-node_modules-

      # 步骤 4: 缓存 Nuxt / Vite 构建缓存
      # 缓存 Nuxt 和 Vite 的构建产物，加速增量构建
      - name: Cache Vite/Nuxt build cache
        uses: actions/cache@v4
        with:
          # 要缓存的目录列表
          path: |
            .nuxt
            node_modules/.cache
          # 缓存键：基于操作系统和 yarn.lock 的哈希值
          key: ${{ runner.os }}-nuxt-cache-${{ hashFiles('yarn.lock') }}
          # 恢复键：回退策略
          restore-keys: |
            ${{ runner.os }}-nuxt-cache-

      # 步骤 5: 安装项目依赖
      # 使用 yarn 安装 npm 依赖包
      - name: Install Dependencies
        run: |
          # 如果存在 yarn.lock 文件，使用 --frozen-lockfile 确保版本一致
          # 否则执行普通安装（会更新 lockfile）
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi

      # 步骤 6: 构建项目
      # 执行 Nuxt 的静态生成命令，生成 dist 目录
      - name: Build Project
        run: yarn generate

      # 步骤 7: 上传构建产物
      # 将构建好的 dist 目录上传为 artifact，供 deploy job 使用
      - name: Upload Artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: dist

  # 部署 job：将构建产物部署到腾讯云
  deploy:
    # 依赖 build job，只有 build 成功后才会执行
    needs: build
    # 运行在最新版本的 Ubuntu 虚拟机上
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 下载构建产物
      # 下载 build job 上传的 dist artifact
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          # 通过 artifact ID 下载指定的构建产物
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          # 下载到 dist 目录
          path: dist

      # 步骤 2: 从缓存中恢复 COSCLI 工具
      # 尝试从缓存中恢复 COSCLI 命令行工具，避免每次都下载
      - name: Restore COSCLI from cache
        id: cache-coscli
        uses: actions/cache/restore@v4
        with:
          # 缓存 coscli 可执行文件的路径
          path: ./coscli
          # 缓存键：指定 COSCLI 版本和平台
          key: coscli-v1.0.7-linux-amd64

      # 步骤 3: 下载 COSCLI 工具
      # 如果缓存未命中，则从 GitHub Releases 下载 COSCLI
      - name: Download COSCLI
        # 条件执行：只在缓存未命中时下载
        if: ${{ steps.cache-coscli.outputs.cache-hit != 'true' }}
        run: |
          # 从 GitHub Releases 下载 COSCLI v1.0.7 Linux 版本
          wget -O ./coscli https://github.com/tencentyun/coscli/releases/download/v1.0.7/coscli-v1.0.7-linux-amd64
          # 添加执行权限
          chmod 755 ./coscli

      # 步骤 4: 保存 COSCLI 到缓存
      # 将下载的 COSCLI 保存到缓存，供后续运行使用
      - name: Save COSCLI to cache
        # 条件执行：只在缓存未命中时保存（避免重复缓存）
        if: ${{ steps.cache-coscli.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          # 要缓存的文件路径
          path: ./coscli
          # 缓存键（与恢复时使用相同的键）
          key: coscli-v1.0.7-linux-amd64

      # 步骤 5: 部署到腾讯云 COS
      # 使用 COSCLI 将构建产物同步到腾讯云对象存储
      - name: Deploy to COS
        run: |
          # 显示 COSCLI 版本信息
          ./coscli --version
          # 同步本地 dist 目录到 COS 存储桶
          ./coscli sync ./dist cos://${{ secrets.COS_WEB_BUCKET_PROD }}/ \
            --recursive \
            --delete \
            --force \
            --init-skip=true \
            --secret-id=${{ secrets.COS_SECRET_ID }} \
            --secret-key=${{ secrets.COS_SECRET_KEY }} \
            --endpoint=cos.${{ secrets.COS_REGION }}.myqcloud.com
          # 参数说明：
          # --recursive: 递归同步所有子目录
          # --delete: 删除 COS 中存在但本地不存在的文件（完全同步）
          # --force: 强制覆盖已存在的文件
          # --init-skip=true: 跳过初始化配置交互
          # --secret-id / --secret-key: 腾讯云 API 密钥（从 Secrets 读取）
          # --endpoint: COS 服务的 endpoint（根据区域动态生成）

      # 步骤 6: 设置 Python 环境
      # 安装 Python，用于运行腾讯云 CLI 工具
      - name: Setup Python
        uses: actions/setup-python@v6

      # 步骤 7: 安装腾讯云 CLI
      # 使用 pip 安装腾讯云命令行工具
      - name: Install Tencent CLI
        run: |
          # 安装 tccli（腾讯云命令行工具）
          pip install tccli
          # 显示版本信息以验证安装成功
          tccli --version

      # 步骤 8: 刷新 CDN 缓存
      # 使用腾讯云 CLI 刷新 CDN 缓存，确保用户访问到最新内容
      - name: Refresh CDN
        run: |
          # 调用 CDN PurgePathCache API 刷新指定路径的缓存
          tccli cdn PurgePathCache \
            --secretId ${{ secrets.COS_SECRET_ID }} \
            --secretKey ${{ secrets.COS_SECRET_KEY }} \
            --FlushType 'flush' \
            --Paths '["https://ef.yituliu.cn/"]'
          # 参数说明：
          # --secretId / --secretKey: 腾讯云 API 密钥
          # --FlushType 'flush': 刷新类型（flush 表示刷新缓存并重新回源）
          # --Paths: 要刷新的 URL 路径列表（JSON 数组格式）
