name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

env:
  NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
  ASSETS_REPO_OWNER: Arknights-yituliu
  ASSETS_REPO_NAME: ef-yituliu-frontend-assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Cache Vite/Nuxt build cache
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache
          key: ${{ runner.os }}-nuxt-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-cache-

      - name: Install Dependencies
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi

      - name: Checkout Assets Repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ASSETS_REPO_OWNER }}/${{ env.ASSETS_REPO_NAME }}
          path: .tmp-assets

      - name: Copy Assets to Project
        run: |
          cp -r .tmp-assets/* .
          rm -rf .tmp-assets

      - name: Build Project
        run: yarn generate

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
